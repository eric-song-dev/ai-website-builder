services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: builder
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://builder:builder@db:5432/builder
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      ARTIFACT_ROOT: /app/artifacts
      DEPLOYMENT_ROOT: /app/deployments
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      - ./deployments:/app/deployments

volumes:
  pgdata:

